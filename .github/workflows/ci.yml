name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore StudioBooking.sln
      - run: dotnet build StudioBooking.sln -c Release --no-restore
      - run: dotnet test StudioBooking.sln -c Release --no-build --logger "console;verbosity=normal"

  # Boots the real stack (Postgres + RabbitMQ + all three services) and runs the
  # demo and the concurrency test against it.
  end-to-end:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Start services
        run: docker compose up --build -d
      - name: Wait for health endpoints
        run: |
          for port in 8081 8082 8083; do
            for i in $(seq 1 60); do
              curl -sf "http://localhost:$port/health" && break
              sleep 2
            done
          done
      - name: Demo flow
        run: PORTS=docker ./scripts/demo.sh
      - name: Concurrency test (no overbooking)
        run: PORTS=docker ./scripts/race.sh
      - name: Notification arrived through RabbitMQ
        run: curl -s http://localhost:8083/notifications | grep -q "spot opened"
      - name: Service logs
        if: always()
        run: docker compose logs --no-color classes-api bookings-api notifications-worker | tail -200
